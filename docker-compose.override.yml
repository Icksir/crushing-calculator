services:
  nginx:
    image: nginx:alpine
    container_name: crushing_calculator_nginx_dev
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - default

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - API_PROXY_TARGET=http://backend:8000
      - NEXT_PUBLIC_API_URL=

  backend:
    volumes:
      - ./backend:/app
